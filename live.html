<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Explainable Deepfake Detection</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 16px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    .dropzone {
      border: 2px dashed #999;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      margin: 16px 0;
    }
    .dropzone.dragover { border-color: #333; background: #f5f5f5; }
    #result { margin-top: 24px; }
    .label { font-size: 1.2rem; font-weight: 600; }
    .label.fake { color: #c0392b; }
    .label.real { color: #27ae60; }
    img.preview { max-width: 100%; border-radius: 8px; margin-top: 12px; }
    #error { color: #c0392b; margin-top: 12px; }
    #loading { margin-top: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>Explainable Deepfake Detection</h1>
  <p>Upload a facial image to classify it as real or fake, with an attention
     heatmap showing which regions influenced the decision.</p>

  <div class="dropzone" id="dropzone">
    <p>Click to choose an image, or drag one here</p>
    <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden />
  </div>

  <div id="loading" hidden>Analyzing...</div>
  <div id="error" hidden></div>
  <div id="result" hidden>
    <div class="label" id="labelText"></div>
    <div id="confidenceText"></div>
    <img class="preview" id="heatmapImg" alt="Attention heatmap overlay" />
  </div>

  <script>
    const API_BASE = ""; // same-origin; set to the API URL if hosted separately
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const result = document.getElementById("result");
    const labelText = document.getElementById("labelText");
    const confidenceText = document.getElementById("confidenceText");
    const heatmapImg = document.getElementById("heatmapImg");

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    async function handleFile(file) {
      errorBox.hidden = true;
      result.hidden = true;
      loading.hidden = false;

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${API_BASE}/predict`, { method: "POST", body: formData });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Request failed (${res.status})`);
        }
        const data = await res.json();

        labelText.textContent = data.label.toUpperCase();
        labelText.className = `label ${data.label}`;
        confidenceText.textContent = `Confidence: ${(data.confidence * 100).toFixed(1)}%`;
        heatmapImg.src = `data:image/png;base64,${data.heatmap_base64}`;
        result.hidden = false;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        loading.hidden = true;
      }
    }
  </script>
</body>
</html>
